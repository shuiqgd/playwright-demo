name: Playwright Tests

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps

      - name: Run homepage standalone script
        run: |
          python tests/test_homepage_standalone.py

      - name: List report files
        if: always()
        run: |
          pwd
          ls -la
          find . -path "*homepage_standalone*" -type f

      - name: Upload homepage report directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-report
          path: reports/homepage_standalone/
          if-no-files-found: warn
